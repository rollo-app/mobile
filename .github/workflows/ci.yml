name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  # Avisa si el backend cambió su contrato y la app no regeneró el cliente.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Si el backend tiene una rama con el mismo nombre (feature que cambia los dos repos), se compara
      # contra su contrato; si no, contra develop.
      - name: Contrato del backend
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          spec="https://raw.githubusercontent.com/rollo-app/backend/${BRANCH}/openapi.json"
          if curl -sfIo /dev/null "$spec"; then
            echo "Contrato de la rama ${BRANCH} del backend"
            echo "API_SPEC=$spec" >> "$GITHUB_ENV"
          else
            echo "Contrato de develop del backend"
          fi
      - run: npm run api:generate
      - name: El cliente está al día con el backend
        run: |
          if ! git diff --exit-code src/api/schema.d.ts; then
            echo "::error::El contrato del backend cambió. Corré 'npm run api:generate' y commiteá src/api/schema.d.ts"
            exit 1
          fi
