name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cada archivo por separado
        run: |
          for f in __tests__/accounts.test.tsx __tests__/add-friends.test.tsx __tests__/cache.test.tsx __tests__/capture.test.tsx __tests__/edit-trip.test.tsx __tests__/event-board.test.tsx __tests__/featuring-levels.test.tsx __tests__/info.test.tsx __tests__/moderation.test.tsx __tests__/moment-banner.test.tsx __tests__/moment.test.tsx __tests__/notifications.test.tsx __tests__/presentation.test.tsx __tests__/reveal-shell.test.tsx __tests__/reveal.test.tsx __tests__/roll-members-screen.test.tsx __tests__/roll-members.test.tsx __tests__/roll-started.test.tsx __tests__/screens.test.tsx __tests__/trips-list.test.tsx __tests__/upload-status.test.tsx src/features/trips/__tests__/group-trips.test.ts ; do
            s=$(date +%s)
            timeout 240 npx jest "$f" --ci -i >/tmp/out.txt 2>&1; code=$?
            echo "RESULT $f exit=$code secs=$(( $(date +%s) - s )) $(grep -E '^Tests:' /tmp/out.txt)"
            [ $code -eq 124 ] && tail -30 /tmp/out.txt
          done

  # Avisa si el backend cambió su contrato y la app no regeneró el cliente.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Si el backend tiene una rama con el mismo nombre y con commits que develop todavía no tiene
      # (feature que cambia los dos repos, sin mergear), se compara contra su contrato; si no, contra develop.
      - name: Contrato del backend
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          spec="https://raw.githubusercontent.com/rollo-app/backend/${BRANCH}/openapi.json"
          ahead=$(gh api "repos/rollo-app/backend/compare/develop...${BRANCH}" --jq .ahead_by 2>/dev/null) || ahead=0
          if [ "$ahead" -gt 0 ]; then
            echo "Contrato de la rama ${BRANCH} del backend"
            echo "API_SPEC=$spec" >> "$GITHUB_ENV"
          else
            echo "Contrato de develop del backend"
          fi
      - run: npm run api:generate
      - name: El cliente está al día con el backend
        run: |
          if ! git diff --exit-code src/api/schema.d.ts; then
            echo "::error::El contrato del backend cambió. Corré 'npm run api:generate' y commiteá src/api/schema.d.ts"
            exit 1
          fi
